[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ldm-project"
version = "0.1.0"
description = "Optical-Path VAE scaffold for latent diffusion migration."
requires-python = ">=3.11"
dependencies = [
  "torch",
  "torchvision",
  "PyYAML",
  "matplotlib",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
