[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ldm-project"
version = "0.1.0"
description = "Single-exposure optical generative student distilled from an LDM teacher."
requires-python = ">=3.11"
dependencies = [
  "torch",
  "torchvision",
  "PyYAML",
  "matplotlib",
  "pydantic==2.11.7",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
