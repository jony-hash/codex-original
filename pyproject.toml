[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ldm-project"
version = "0.1.0"
description = "Single-exposure optical generative student distilled from an LDM teacher."
requires-python = ">=3.11"
dependencies = [
  "torch",
  "torchvision",
  "PyYAML",
  "matplotlib",
  "pydantic==2.11.7",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Historical experiment tests are preserved under experiments/archive as reference-only
# material.  The default suite covers only the active runtime and its regression tests.
testpaths = ["tests"]
addopts = "-m 'not scheduled_diagnostic'"
markers = [
  "scheduled_diagnostic: slower diagnostic-only workflows run outside the default regression lane",
]
# Matplotlib releases supported by the current environment call NumPy 2's
# __array__ protocol without the new copy keyword.  This is a third-party
# compatibility warning, scoped to the exact module and message; repository
# warnings remain visible.
filterwarnings = [
  "ignore:__array__ implementation doesn't accept a copy keyword:DeprecationWarning:matplotlib\\.cbook",
]
