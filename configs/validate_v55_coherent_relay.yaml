training:
  mode: one_shot_sample
  batch_size: 1
  first_stage_epochs: 0
  diffusion_epochs: 0
  one_shot_epochs: 0
seed: 1234
physics:
  optics: {wavelength: 5.32e-7, pixel_size: 2.5e-6}
  geometry: {grid_size: 200, prop_dist: 1.0e-3}
  readout: {primary_plane: camera, save_camera_plane: true, normalize_percentile: 99.5}
  macro_optics:
    dist_laser_to_m1: 0.350
    dist_m1_to_bs: 0.370
    dist_bs_to_slm: 0.025
    dist_slm_to_bs: 0.025
    dist_bs_to_m3: 0.125
    dist_m3_to_front_lens1: 0.07321428571428572
    dist_front_lens1_to_lens2: 0.3125
    dist_front_lens2_to_encoder: 0.0892857142857143
    dist_m3_to_lg: 0.475
    dist_lg_to_relay_lens: 0.100
    dist_relay_lens_to_cmos: 0.250
    dist_lg_to_cmos: 0.350
    f_relay: 0.0714285714
    front_lens1_focal_length: 0.22321428571428573
    front_lens2_focal_length: 0.0892857142857143
    front_lens1_clear_aperture: 0.02375
    front_lens2_clear_aperture: 0.02375
    back_relay_clear_aperture: 0.0266
    propagation_grid_size: 2048
  front_path_model: coherent_imaging_4f
  back_path_model: free_space
  physical_forward_contract: true
first_stage: {type: optical_path_vae, image_size: 200, latent_channels: 1}
one_shot:
  optical_core_arch: diffractive_phase_only
  code_dim: 128
  label_embed_dim: 32
  hidden_dim: 256
  num_classes: 10
  ols_kind: identity
  physical_forward_contract: true
  target_code_diagnostic_mode: none
  target_code_bridge_source: none
  ols_transfer_calibration: none
  d2nn:
    wavelength: 5.32e-7
    pixel_size: 2.0e-6
    grid_size: 100
    propagation_grid_size: 1024
    encoder_layers: 2
    decoder_layers: 2
    layer_spacing: 1.5e-3
    modulation: phase_only
    phase_init: uniform_pi
