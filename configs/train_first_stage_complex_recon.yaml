training:
  # 专门用于复杂数字重建的第一阶段配置；先把 OpticalPathVAE 练稳，再接 diffusion。
  mode: first_stage
  batch_size: 32
  learning_rate: 8.0e-5
  step_log_interval: 100
  visual_save_epoch_interval: 5
  validation_epoch_interval: 5
  first_stage_epochs: 160
  diffusion_epochs: 0

data:
  dataset: mnist
  root: data
  download: true
  validation_fraction: 0.1
  validation_split_seed: 42
  # 当前 0.1667 子集对复杂笔画覆盖偏少；0.5 先扩大样本多样性，仍比全量更易迭代。
  subset_fraction: 0.5
  subset_seed: 42
  num_workers: 0
  pin_memory: true

first_stage:
  type: optical_path_vae
  image_size: 200
  # 提高 latent/decoder 容量，给 2/3/5/6/8/9 这类复杂笔画更多表达空间。
  latent_channels: 12
  encoder_channels: [64, 128, 320]
  decoder_tail_channels: 96
  readout_plane: camera
  latent_position: post_encoder_pre_ols
  ols:
    kind: pointwise_tanh
  # 降低原图辅助强度并放慢退火，避免 epoch 25 式断崖；后 100 epoch 保持纯 optical 训练。
  encoder_fusion_mode: gated_dual_path
  image_fusion_start_weight: 0.25
  image_fusion_end_weight: 0.0
  image_fusion_decay_epochs: 60
  image_fusion_schedule: cosine
  optical_field_mode: complex_cartesian
  primary_output: camera
  freeze_after_pretrain: true
  # 复杂数字优先保重建细节，KL 稍弱一些，但仍保留 latent 正则供 diffusion 使用。
  kl_beta: 3.0e-5
  kl_warmup_ratio: 0.15
  recon_foreground_threshold: 0.05
  recon_foreground_weight: 10.0
  recon_background_weight: 1.3
  image_recon_weight: 0.25
  camera_recon_weight: 1.5
  # 加强 camera 结构与形状约束，抑制块状亮斑替代真实笔画。
  structure_recon_weight: 0.5
  shape_recon_weight: 0.45
  field_smoothness_weight: 0.04
  phase_smoothness_weight: 0.02
  background_leakage_weight: 0.05
  electronic_domain:
    mode: mnist_complex_slm
    background_floor: 0.05
    gamma: 1.0
    polarity: non_inverted
    phase_scale_rad: 3.141592653589793
    phase_bias_rad: 0.0

diffusion:
  timesteps: 1000
  beta_start: 1.0e-4
  beta_end: 0.02
  base_channels: 64
  channel_multipliers: [1, 2, 4]
  num_res_blocks: 2
  attention_levels: [1, 2]
  num_heads: 4
  context_dim: 128
  num_classes: 10
  cond_dropout_prob: 0.1
  latent_source: mu
  guidance_scale: 2.0
