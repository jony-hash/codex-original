optics:
  # 采用米制单位存储；5.32e-7 m 即 532 nm。
  wavelength: 5.32e-7
  pixel_size: 2.5e-6

geometry:
  grid_size: 200
  prop_dist: 1.0e-3

readout:
  primary_plane: camera
  save_camera_plane: true
  normalize_percentile: 99.5

macro_optics:
  # 通用/teacher 基础光路参数；本文件不是 formal physical-forward 配置。
  # Formal v55/v56 配置必须在自身 physics section 中声明 coherent 4f relay、lens pupil 和 identity OLS。
  dist_laser_to_m1: 0.350
  dist_m1_to_bs: 0.370
  dist_bs_to_slm: 0.025
  dist_slm_to_bs: 0.025
  dist_bs_to_m3: 0.125
  dist_m3_to_lg: 0.475
  dist_lg_to_relay_lens: 0.100
  dist_relay_lens_to_cmos: 0.250
  dist_lg_to_cmos: 0.350
  # 由 u=100 mm, v=250 mm 按薄透镜公式反推，保证 CMOS 位于合焦像面。
  f_relay: 0.0714285714
