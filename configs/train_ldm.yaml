training:
  # 线性超表面 first stage：先让 camera_hat 在物理读出上稳定可读，再单独训练 diffusion。
  mode: first_stage
  batch_size: 16
  learning_rate: 1.0e-4
  # 终端与 training_history 都按每轮 train 内的 step 间隔记录，同时保留每个 epoch 末尾一条。
  step_log_interval: 100
  # 按 epoch 控制训练时长；当前 subset_fraction=0.1667 且 batch_size=16 时，约 563 step/epoch。
  visual_save_epoch_interval: 5
  validation_epoch_interval: 5
  first_stage_epochs: 35
  diffusion_epochs: 0

data:
  dataset: mnist
  root: data
  download: true
  # 只在官方 train=60000 内切分验证集，避免训练中碰到官方 test。
  validation_fraction: 0.1
  validation_split_seed: 42
  subset_fraction: 0.1667
  subset_seed: 42
  num_workers: 0
  pin_memory: true

first_stage:
  type: optical_path_vae
  image_size: 200
  latent_channels: 4
  encoder_channels: [64, 128, 256]
  decoder_tail_channels: 64
  readout_plane: camera
  latent_position: post_encoder_pre_ols
  ols:
    kind: identity
  # strict optical-only：只从 PF2 复场进入线性超表面 encoder，不接原图分支。
  encoder_fusion_mode: optical_only
  optical_encoder_input_mode: pf2_complex_field
  optical_encoder_arch: linear_metasurface
  metasurface_decoder_arch: linear_metasurface
  linear_metasurface_grid_size: 40
  linear_metasurface_layer_spacing: 0.003
  image_fusion_start_weight: 0.0
  image_fusion_end_weight: 0.0
  image_fusion_decay_epochs: 1
  # decoder 由 4 层线性超表面代理输出复 chip 场；image_recon 仅作诊断。
  optical_field_mode: complex_cartesian
  primary_output: camera
  freeze_after_pretrain: true
  kl_beta: 5.0e-5
  kl_warmup_ratio: 0.1
  # 强化前景笔画，主监督只看 camera 平面读出。
  recon_foreground_threshold: 0.05
  recon_foreground_weight: 3.0
  recon_background_weight: 1.0
  image_recon_weight: 0.0
  camera_recon_weight: 1.0
  # Sobel 边缘 + 前景 Dice + 复场平滑约束，减少块状亮斑和相位散斑替代真实笔画。
  structure_recon_weight: 0.25
  shape_recon_weight: 1.0
  field_smoothness_weight: 0.01
  phase_smoothness_weight: 0.005
  field_energy_weight: 0.01
  background_leakage_weight: 0.2
  camera_hotspot_weight: 0.25
  camera_topology_weight: 0.15
  camera_saturation_weight: 0.05
  electronic_domain:
    # 默认恢复为复振幅 SLM，让前向光路不再被固定零相位限制住。
    mode: mnist_complex_slm
    background_floor: 0.05
    gamma: 1.0
    polarity: non_inverted
    phase_scale_rad: 3.141592653589793
    phase_bias_rad: 0.0

diffusion:
  # 这里的 1000 指扩散噪声日程长度，不是训练优化步数。
  timesteps: 1000
  beta_start: 1.0e-4
  beta_end: 0.02
  base_channels: 64
  channel_multipliers: [1, 2, 4]
  num_res_blocks: 2
  attention_levels: [1, 2]
  num_heads: 4
  context_dim: 128
  num_classes: 10
  cond_dropout_prob: 0.1
  latent_source: mu
  # diffusion-only 对照先试 2.0；若类别语义不足，再和 3.0 做同配置对比。
  guidance_scale: 2.0
