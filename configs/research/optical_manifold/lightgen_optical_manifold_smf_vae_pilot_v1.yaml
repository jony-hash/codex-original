optical_contract:
  formal_system_kind: formal_amplitude_finite_crop_identity
  wavelength_m: 5.32e-7
  slm_shape: [200, 200]
  slm_pixel_pitch_m: 2.5e-6
  metasurface_shape: [100, 100]
  metasurface_pixel_pitch_m: 2.0e-6
  propagation_grid_size: 2048
  encoder_layers: 2
  decoder_layers: 2
  boundary: finite_crop
  formal_ols: identity
  research_ols: 100_port_lp01_smf
  posterior_domain: 100_complex_coefficients_as_200_real
  posterior_head: shared_per_port_linear_16_silu
  posterior_status: project_approximation
  injector_status: research_hybrid_active_latent_injector
  front_relay: coherent_imaging_4f
  back_relay: free_space
  input_encoding: intensity_sqrt_amplitude
  target: camera_intensity_same_fov
  exposure: {scale: 1.0, gamma: 1.0}

training:
  arms: [smf_beta_vae, smf_stochastic_no_kl, smf_deterministic_mse]
  optimizer: Adam
  optimizer_update_device: cpu_shadow
  learning_rate: 1.0e-3
  reset_adam_from_source: true
  steps_per_arm: 100
  checkpoint_interval: 50
  reconstruction_activation_checkpoint: true
  deterministic: true
  epsilon_seed: 1234
  initial_logvar: -6.0
  logvar_range: [-12.0, 2.0]
  kl_reduction: mean_over_200_real_dimensions
  beta_calibration: 0.1_encoder_reconstruction_norm_over_kl_norm
  no_early_stop: true
  no_tuning: true
  no_checkpoint_selection: true

gates:
  min_free_cuda_bytes: 4294967296
  max_peak_cuda_bytes: 5368709120
  max_preflight_wall_seconds: 300
  max_wall_seconds: 1800
  max_storage_bytes: 1073741824
  safety_mse_ratio: 2.0
  max_heldout_mse_relative_to_deterministic: 1.10
  min_posterior_variance_retention: 0.50
  evaluator_calls: 0

authorization:
  reviewer_role: project_owner
  decision: approve_bounded_smf_hybrid_vae_pilot
  bounded_diagnostic_training_authorized: true
  training_authorized: false
  formal_training_authorized: false
  formal_promotion: false
  post_pass_next_action: manual_review_fmf_m2_reconstruction_pilot_contract
