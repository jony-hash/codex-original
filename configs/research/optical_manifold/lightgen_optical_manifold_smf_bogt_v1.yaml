schema: lightgen_optical_manifold_smf_bogt_v1
hypothesis: H-LOMA-CBOGT-S0
formal_system_config: configs/v2/current/formal_identity_logit_amplitude_finite_crop_identity.yaml

source:
  status:
    fiber_dimensions: user_locked_scaled_deviation
    prior: high_confidence_inference
    power_loss: high_confidence_inference
    backend_imaging: high_confidence_inference
    kl_formula: high_confidence_inference
  chen_reference: paper_reported
  unpublished_details: unknown
  existing_mode_bank: user_locked_scaled_deviation

dataset:
  train_count: 55000
  validation_count: 5000
  calibration_count: 1000
  logical_batch_size: 10
  microbatch_size: 1
  schedule: class_balanced_one_per_label_without_replacement
  schedule_seed: 1234
  calibration_and_schedule_disjoint: true
  input_shape: [1, 28, 28]
  rendered_shape: [1, 200, 200]

optical_contract:
  formal_system_kind: formal_amplitude_finite_crop_identity
  wavelength_m: 5.32e-7
  slm_shape: [200, 200]
  slm_pixel_pitch_m: 2.5e-6
  metasurface_shape: [100, 100]
  metasurface_pixel_pitch_m: 2.0e-6
  propagation_grid_size: 2048
  encoder_layers: 2
  decoder_layers: 2
  layer_spacing_m: 1.50e-3
  boundary: finite_crop
  input_encoding: intensity_sqrt_amplitude
  mode_bank: scaled_lp01_10x10
  ols_ports: 100
  mode_model: step_index_lp01_ports
  mode_v_number: 2.2
  mode_waist_m: 7.111e-6
  mode_fill: 0.8
  fixed_layer_power_transmission: 0.889
  fiber_reference_length_m: 8.5e-3
  fiber_reference_outer_diameter_m: 125.0e-6
  fiber_reference_status: paper_reference_metadata_only
  backend_total_distance_m: 3.0e-3
  backend_magnification: -2.5
  backend_geometry_status: inferred_backend_imaging
  backend_pupil: no_extra_clipping_ideal_thin_lens
  calibrated_phase: zero_residual_phase
  software_decoder: false
  formal_promotion: false

bogt:
  latent: z_j=abs(c_j)^2/s_j
  scale_source: independent_train_only_zero_phase_1000_mean_port_power
  scale_floor: 0.001
  prior:
    kind: truncated_normal
    mean: 1.0
    variance: 0.25
    lower: 0.0
  aggregate: class_balanced_logical_batch_10_diagonal_moments
  kl_surrogate: gaussian_covariance_log_variance
  paper_logdet_correction: log_det_M2_interpreted_as_log_variance_term
  two_pass_microbatch: true
  prior_phase: fixed_calibrated_zero_residual

training:
  arms: [mse_only, mse_op, mse_kl, mse_kl_op]
  steps_per_arm: 100
  checkpoint_interval: 50
  optimizer: Adam
  learning_rate: 1.0e-3
  reset_optimizer_per_arm: true
  zero_phase_seed: 1234
  posthoc_phase_quantization: [0.0, 0.82, 1.63, 2.45, 3.26, 4.08, 4.89, 5.71]
  qat: false

gates:
  gradient_target_ratio: 0.10
  gradient_ratio_range: [0.05, 0.40]
  heldout_mse_relative_to_mse_op: 1.10
  min_kl_relative_reduction: 0.05
  min_lop_relative_reduction: 0.10
  min_ols_effective_rank_retention: 0.90
  preflight_steps: 3
  resume_segment: 2+1
  cuda_required: true

authorization:
  reviewer_role: project_owner
  decision: authorize_independent_scaled_chen_bogt_lifecycle_only
  bounded_diagnostic_training_authorized: true
  training_authorized: false
  formal_training_authorized: false
  formal_promotion: false
  post_validation_next_action: run_smf_bogt_preflight
  post_preflight_next_action: manual_review_scaled_chen_bogt_pilot_contract
  prohibited:
    - formal_v2_change
    - formal_smf_or_fmf_change
    - electronic_vae_latent_injector
    - fmf_transition
    - automatic_long_training
    - prior_generation_before_pilot_and_review
    - promotion
