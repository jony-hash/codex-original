  v5_dimension_metrics: outputs/20261014_ols_window_dimension_power_v5/runs/attempt_01/dimension_power_metrics.json
  v5_fixed_phase_screens: outputs/20261014_ols_window_dimension_power_v5/runs/attempt_01/fixed_phase_screens.pt
optics:
  wavelength_m: 5.32e-7
  pixel_pitch_m: 2.0e-6
  encoder_shape: [100, 100]
