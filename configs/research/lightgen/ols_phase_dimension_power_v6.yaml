  gaussian_and_lp01_projection_passivity_relative_tolerance: 1.0e-5
  main_phase_diagnostic_updates: 19968
evidence:
  keep_all_trajectory_initial_best_terminal_phases: true
  keep_optimizer_checkpoints_at_updates: [0, 64, 128, 192, 256]
  keep_every_update_target_history: true
  keep_endpoint_channel_metrics_and_window_comparisons: true
  keep_all_six_window_precision_roi_fields_for_representatives: true
  return_compact_3072_complex64_roi_fields_only: true
  retain_nonrepresentative_raw_roi_fields: false
scope:
