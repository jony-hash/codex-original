  random_phase_distribution: independent_uniform[-pi,pi] per layer and pixel
  name: Adam
  learning_rate: 0.04
  betas: [0.9, 0.999]
  epsilon: 1.0e-8
  weight_decay: 0.0
  scheduler: none
  early_stopping: false
