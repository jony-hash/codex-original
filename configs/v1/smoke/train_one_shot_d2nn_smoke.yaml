training:
  mode: one_shot
  batch_size: 2
  learning_rate: 1.0e-4
  step_log_interval: 1
  visual_save_epoch_interval: 1
  validation_epoch_interval: 1
  first_stage_epochs: 0
  diffusion_epochs: 0
  one_shot_epochs: 1

data:
  dataset: mnist
  root: data
  download: true
  subset_size: 4
  validation_fraction: 0.5
  validation_split_seed: 42
  subset_seed: 42
  num_workers: 0
  pin_memory: false

first_stage:
  type: optical_path_vae
  image_size: 16
  latent_channels: 1
  primary_output: camera

diffusion:
  num_classes: 10

one_shot:
  optical_core_arch: diffractive_phase_only
  # ── D2NN 全局参数 ──
  d2nn:
    wavelength: 5.32e-7
    pixel_size: 2.5e-6
    grid_size: 16
    propagation_grid_size: 64
    encoder_layers: 2
    decoder_layers: 2
    layer_spacing: 0.004
    modulation: phase_only
    phase_init: uniform_pi
  # ────────────────────
  code_dim: 8
  label_embed_dim: 4
  hidden_dim: 16
  num_classes: 10
  slm_background_floor: 0.05
  ols_kind: identity
  metasurface_grid_size: 8
  layer_spacing: 0.003
  sample_class_labels: [0, 1]
  sample_repeats_per_class: 1
