schema_version: 1
archives:
  - id: pre-v56-configs
    version_range: v3-v53
    original_path: configs/*.yaml (excluding active Golden Path, smoke, v52/v55/v56 entries)
    archived_path: experiments/archive/pre_v56/configs/*.yaml
    role: historical student configurations, early physical-forward probes, and obsolete audits
    diagnostic_only: true
    runnable: false
    replacement: configs/train_v56_coherent_relay_from_scratch.yaml
    evidence_paths:
      - docs/ldm_migration/experiment_history.md
      - docs/ldm_migration/current_handoff.md
    source_commit: bb2d8ee
  - id: pre-v57-tools
    version_range: v9-v54
    original_path: tools/{audit,build,diagnose,run,sweep,validate}_v*.py
    archived_path: experiments/archive/pre_v57/tools/
    role: historical diagnostics and obsolete launchers
    diagnostic_only: true
    runnable: false
    replacement: tools/diagnose_v57_first_collapse_complex_field.py
    evidence_paths:
      - docs/ldm_migration/experiment_history.md
      - docs/ldm_migration/current_handoff.md
    source_commit: bb2d8ee
