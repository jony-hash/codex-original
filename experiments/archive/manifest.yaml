schema_version: 1
archives:
  - id: pre-v56-configs
    version_range: v3-v53
    original_path: configs/*.yaml (excluding active Golden Path, smoke, v52/v55/v56 entries)
    archived_path: experiments/archive/pre_v56/configs/*.yaml
    role: historical student configurations, early physical-forward probes, and obsolete audits
    diagnostic_only: true
    runnable: false
    replacement: configs/v1/formal/train_v56_coherent_relay_from_scratch.yaml
    evidence_paths:
      - docs/status/experiment_history.md
      - docs/status/current_handoff.md
    source_commit: bb2d8ee
  - id: pre-v57-tools
    version_range: v9-v54
    original_path: tools/{audit,build,diagnose,run,sweep,validate}_v*.py
    archived_path: experiments/archive/pre_v57/tools/
    role: historical diagnostics and obsolete launchers
    diagnostic_only: true
    runnable: false
    replacement: tools/diagnose_v57_first_collapse_complex_field.py
    evidence_paths:
      - docs/status/experiment_history.md
      - docs/status/current_handoff.md
    source_commit: bb2d8ee
  - id: v52-v56-tools
    version_range: v52-v56
    original_path: tools/validate_v{52,55,56}_*.py
    archived_path: experiments/archive/pre_v56/tools/
    role: historical physical-forward and relay validation launchers
    diagnostic_only: true
    runnable: false
    replacement: configs/v1/diagnostic/ and configs/v1/formal/
    evidence_paths:
      - docs/status/experiment_history.md
    source_commit: 758363e
  - id: v57-v67-tools
    version_range: v57-v67
    original_path: tools/{diagnose,run,export}_v*.py
    archived_path: experiments/archive/v57_v67/tools/
    role: historical collapse, propagation, and transparent-boundary diagnostics
    diagnostic_only: true
    runnable: false
    replacement: docs/status/current_handoff.md
    source_commit: 758363e
  - id: v68-v69-tools-and-configs
    version_range: v68-v69
    original_path: tools/{audit,decide,diagnose}_v6*.py; configs/train_v6*.yaml
    archived_path: experiments/archive/v68_v69/{tools,configs}/
    role: historical raw-CMOS admission and code-distillation research
    diagnostic_only: true
    runnable: false
